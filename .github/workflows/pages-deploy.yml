name: pages-deploy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'publish.html'
      - '.nojekyll'
      - 'data/**'
      - 'output/**'
      - 'skills/ai-daily-digest/cards.css'
      - 'skills/ai-daily-digest/cards.js'
      - 'scripts/doctor_publish.py'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify daily index before deploy
        run: python3 scripts/doctor_publish.py --stage pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
