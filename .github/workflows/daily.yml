name: daily-ai-watch

on:
  schedule:
    - cron: "0 23 * * *"       # UTC 23:00 = 北京时间次日 07:00（中国无夏令时，全年稳定）
  workflow_dispatch: {}          # 支持在 Actions 页手动触发

permissions:
  contents: write                # 提交 data/ 与 output/

concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Install deps
        run: |
          pip install -r skills/ai-daily-digest/requirements.txt
          npm i playwright
          npx playwright install --with-deps chromium

      - name: Run pipeline (live · all vendors)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 在仓库 Settings → Secrets 配置
          DIGEST_OUT: ${{ github.workspace }}                   # data/ output/ 提交到仓库根
        run: |
          # 自适应：厂商列表从 run.py --vendors 读取，新增厂商后无需改本文件
          vendors=$(python skills/ai-daily-digest/run.py --vendors \
            | python -c "import sys,json;print(' '.join(x['id'] for x in json.load(sys.stdin)))")
          echo "vendors: $vendors"
          for v in $vendors; do
            echo "::group::vendor $v"
            python skills/ai-daily-digest/run.py --live --vendor "$v" --engine playwright \
              || echo "vendor $v 失败，跳过继续"
            echo "::endgroup::"
          done

      - name: Commit & push results
        run: |
          git config user.name "watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data output
          git commit -m "daily: $(date -u +%F)" || { echo "无新内容"; exit 0; }
          git push
