name: daily-monitor

# 信源监控哨兵（不出内容）。
# 职责分工：出内容由 Codex Automation 负责（北京 07:00，会开讨论 Issue）；
# 本 workflow 只做「信源健康探测 + 校验当天 automation 是否已产出」，发现异常自动开 Issue 告警。
# 不调 LLM、不装浏览器、不写 main —— 轻量、确定、零额外凭据。

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京 07:00；GitHub 调度延迟后实际约 07:55，
                            # 落在 Codex Automation 之后，正好用来校验其当天产出。
  workflow_dispatch: {}     # 支持在 Actions 页手动触发

permissions:
  contents: read            # 只读仓库；不再向 main 提交
  issues: write             # 异常时开/更新告警 Issue

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai      # 让 run.py 的「今天」按北京日期判断
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install deps (lightweight · no browser / no LLM)
        run: pip install -r skills/ai-daily-digest/requirements.txt

      - name: Probe sources & verify automation output
        id: probe
        run: |
          set +e
          python skills/ai-daily-digest/run.py --probe | tee probe.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0   # 探测到异常不让 step 失败；告警走下面的 Issue（含链接的通知邮件）

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 信源监控哨兵 $(date +%F)"
            echo '```'
            cat probe.log 2>/dev/null || echo "(无日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open / update alert issue on anomaly
        if: steps.probe.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%F)
          TITLE="🚨 监控告警 ${TODAY}：每日动态异常"
          BODY=$(printf '哨兵在 %s 检测到异常（今日无 Codex Automation 产出，或有停更信源）。\n\n```\n%s\n```\n\n— 由 daily-monitor workflow 自动生成；指派给仓库 owner 以触发含本 Issue 链接的通知邮件。' "$TODAY" "$(cat probe.log)")
          # 同日去重：当天若已有同标题且 open 的告警 Issue，则追加评论而非新开
          NUM=$(gh issue list --search "in:title \"${TITLE}\"" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "${{ github.repository_owner }}"
          fi

      - name: Upload health snapshot (artifact, not committed to main)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sources-health
          path: output/sources_health.json
          if-no-files-found: ignore
