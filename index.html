<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 前哨 · 每日 AI 大厂动态</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,500&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skills/ai-daily-digest/cards.css">
<style>
  :root{
    --cream:#F1ECE0;--paper:#FBF8F1;--ink:#26221C;--clay:#C1572E;
    --soft:#7A7363;--line:#D8CFBC;
    --h0:#E7DFCD;--h1:#E7C2A6;--h2:#D88E62;--h3:#C1572E;--h4:#9B3E1C;
  }
  /* 各厂商选中时：页面强调色 + 热力图梯度切到该厂商品牌色（卡片本身另由 cards.css 的 .v-<id> 换肤） */
  body.v-openai{
    --clay:#0E8C6B;--soft:#6E7B75;--line:#D2DAD6;
    --h0:#E5EAE7;--h1:#BFE6D7;--h2:#79D0B2;--h3:#10A37F;--h4:#0B7355;
  }
  body.v-gemini{
    --clay:#3B5BD0;--soft:#646B7D;--line:#D6DCEC;
    --h0:#E7E9F3;--h1:#C9D4F7;--h2:#8FA8F0;--h3:#4F7CF7;--h4:#3B5BD0;
  }
  body.v-nvidia{
    --clay:#5E9400;--soft:#6E7568;--line:#D7DCCD;
    --h0:#E8ECDD;--h1:#CFE3A8;--h2:#A4D65E;--h3:#76B900;--h4:#5E9400;
  }
  body.v-cn{
    --clay:#C8281E;--soft:#7A6B62;--line:#E6D8D2;
    --h0:#F1E3DD;--h1:#F0C3B6;--h2:#E6877A;--h3:#E0392B;--h4:#B5261B;
  }
  html{-webkit-text-size-adjust:100%}
  html,body{overflow-x:hidden;width:100%}
  body{background:var(--cream);color:var(--ink);
    font-family:"Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
    padding:24px 20px 64px;max-width:920px;margin:0 auto;line-height:1.5}
  a{color:var(--clay)}
  header{padding:6px 2px 20px;border-bottom:2px solid var(--line);margin-bottom:8px}
  .brand{font-family:"Space Mono","DejaVu Sans Mono",monospace;font-size:12px;letter-spacing:3px;
    text-transform:uppercase;color:var(--clay)}
  h1{font-family:"Noto Serif SC",serif;font-size:30px;letter-spacing:-.5px;margin-top:4px}
  .sub{color:var(--soft);font-size:14px;margin-top:8px}

  /* 厂商切换 */
  .vendors{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px}
  .vtab{font-family:"Space Mono","DejaVu Sans Mono",monospace;font-size:13px;letter-spacing:1px;
    cursor:pointer;padding:8px 18px;border:1px solid var(--line);border-radius:999px;
    background:var(--paper);color:var(--soft);transition:.15s;user-select:none;display:flex;align-items:center;gap:7px}
  .vtab .dotv{width:9px;height:9px;border-radius:999px;background:currentColor;opacity:.6}
  .vtab-daily{--vc:#26221C}
  .vtab[data-v="anthropic"]{--vc:#C1572E}
  .vtab[data-v="openai"]{--vc:#10A37F}
  .vtab[data-v="gemini"]{--vc:#3B5BD0}
  .vtab[data-v="nvidia"]{--vc:#5E9400}
  .vtab[data-v="cn"]{--vc:#C8281E}
  .vtab:hover{border-color:var(--vc);color:var(--vc)}
  .vtab.on{background:var(--vc);border-color:var(--vc);color:#fff}
  .vtab.on .dotv{opacity:.9;background:#fff}

  .meta{color:var(--soft);font-size:13px;margin:14px 2px 4px;
    font-family:"Space Mono","DejaVu Sans Mono",monospace}

  /* 3D 轮播 */
  .carousel{position:relative;height:440px;margin:14px 0 2px;perspective:1600px;
    perspective-origin:50% 45%;touch-action:pan-y;overflow:hidden}
  .stage{position:absolute;inset:0;transform-style:preserve-3d}
  .card3d{--cw:268;position:absolute;top:50%;left:50%;
    width:calc(var(--cw)*1px);height:calc(var(--cw)*1px*4/3);
    border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);
    box-shadow:0 14px 34px rgba(0,0,0,.20);
    transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .5s,filter .5s;
    cursor:pointer;backface-visibility:hidden;will-change:transform}
  .card3d .deckcard{position:absolute;top:0;left:0;width:1080px;height:1440px;
    transform:scale(calc(var(--cw)/1080));transform-origin:top left;pointer-events:none}
  .card3d.active{box-shadow:0 22px 52px rgba(0,0,0,.34);cursor:zoom-in}
  @media(max-width:640px){
    body{padding:20px 12px 56px}
    .card3d{--cw:286}.carousel{height:440px}
    h1{font-size:26px}
  }
  @media(max-width:380px){ .card3d{--cw:260}.carousel{height:404px} }

  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:30;
    width:40px;height:40px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper);color:var(--clay);font-size:22px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.12);
    transition:.15s;user-select:none}
  .nav:hover{background:var(--clay);color:#fff;border-color:var(--clay)}
  .nav.prev{left:0}.nav.next{right:0}
  .dots{display:flex;justify-content:center;gap:7px;margin-top:6px;flex-wrap:wrap}
  .dot{width:7px;height:7px;border-radius:999px;background:var(--line);cursor:pointer;transition:.15s}
  .dot.on{background:var(--clay);transform:scale(1.3)}
  .empty{color:var(--soft);padding:40px 4px}

  /* 跨厂商日报：把当天四家拉通，按标签聚合的纵向列表（移动端友好） */
  .digest{margin:16px 0 2px}
  .dgroup{margin-bottom:26px}
  .dtag{font-family:"Noto Serif SC",serif;font-size:17px;color:var(--ink);
    display:flex;align-items:center;gap:9px;margin:0 2px 8px;
    padding-bottom:8px;border-bottom:2px solid var(--line)}
  .dtag .dn{font-family:"Space Mono","DejaVu Sans Mono",monospace;font-size:12px;color:var(--soft);
    background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
  .ditem{display:flex;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .ditem:last-child{border-bottom:none}
  .vbadge{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:fit-content;
    font-family:"Space Mono","DejaVu Sans Mono",monospace;font-size:11px;letter-spacing:.5px;
    color:var(--vc);border:1px solid var(--vc);border-radius:999px;padding:3px 11px;
    background:color-mix(in srgb,var(--vc) 9%,transparent);white-space:nowrap}
  .vbadge .vdot{width:7px;height:7px;border-radius:999px;background:var(--vc)}
  .dbd{flex:1 1 auto;min-width:0}
  .dbd h4{font-family:"Noto Serif SC",serif;font-size:17px;line-height:1.42;font-weight:700}
  .dbd p{font-size:14px;line-height:1.62;color:var(--soft);margin-top:5px}
  .dsrc{font-family:"Space Mono","DejaVu Sans Mono",monospace;font-size:12px;color:var(--clay);margin-top:8px}
  @media(max-width:640px){
    .ditem{flex-direction:column;gap:8px}
    .dbd h4{font-size:16px}
  }

  /* 热力图 */
  .heat{margin-top:46px;padding-top:26px;border-top:2px solid var(--line)}
  .heat-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .heat h2{font-family:"Noto Serif SC",serif;font-size:18px}
  .heat-head .hint{color:var(--soft);font-size:13px}
  .cal-wrap{overflow-x:auto;padding:16px 2px 4px}
  .cal{display:inline-grid;grid-auto-flow:column;grid-template-rows:13px repeat(7,11px);
    grid-auto-columns:11px;gap:3px;font-family:"Space Mono","DejaVu Sans Mono",monospace}
  .cal .mon{font-size:10px;color:var(--soft);height:13px;line-height:13px;white-space:nowrap}
  .cal .wd{font-size:9px;color:var(--soft);line-height:11px;text-align:right;
    padding-right:5px;white-space:nowrap}
  .cell{width:11px;height:11px;border-radius:2px;background:var(--h0);
    outline:1px solid rgba(0,0,0,.04);outline-offset:-1px}
  .cell.l1{background:var(--h1)}.cell.l2{background:var(--h2)}
  .cell.l3{background:var(--h3)}.cell.l4{background:var(--h4)}
  .cell.has{cursor:pointer}
  .cell.sel{outline:2px solid var(--ink);outline-offset:1px}
  .legend-row{display:flex;justify-content:space-between;align-items:center;
    margin-top:10px;color:var(--soft);font-size:12px;
    font-family:"Space Mono","DejaVu Sans Mono",monospace}
  .legend{display:flex;align-items:center;gap:6px}
  .legend .cell{width:11px;height:11px}

  #tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:#fff;
    font-size:12px;padding:6px 9px;border-radius:7px;opacity:0;transform:translate(-50%,-100%);
    transition:opacity .1s;white-space:nowrap;font-family:"Space Mono","DejaVu Sans Mono",monospace}

  /* 灯箱：放大同一张 HTML 卡片 */
  #box{position:fixed;inset:0;z-index:60;background:rgba(20,18,14,.88);
    display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  #boxStage{position:relative;border-radius:16px;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.5)}
  #boxStage .deckcard{position:absolute;top:0;left:0;width:1080px;height:1440px;transform-origin:top left}
  footer{margin-top:40px;color:var(--soft);font-size:12px;text-align:center;
    font-family:"Space Mono","DejaVu Sans Mono",monospace}
</style>
</head>
<body>
<header>
  <div class="brand">AI · FRONTIER · DAILY</div>
  <h1>AI 前哨 · 每日 AI 大厂动态</h1>
  <div class="sub" id="sub">每日采集 AI 大厂官方动态。</div>
</header>

<div class="vendors" id="vendors"></div>
<div class="meta" id="meta"></div>
<div id="app"></div>

<section class="heat" id="heat" hidden>
  <div class="heat-head"><h2>采集热力图</h2><span class="hint" id="heatHint"></span></div>
  <div class="cal-wrap"><div class="cal" id="cal"></div></div>
  <div class="legend-row">
    <span>点击单元格查看当天卡片</span>
    <div class="legend">少 <span class="cell"></span><span class="cell l1"></span>
      <span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> 多</div>
  </div>
</section>

<div id="tip"></div>
<div id="box"><div id="boxStage"></div></div>
<footer>由 ai-daily-digest skill 自动生成 · <a href="https://github.com/yinjialu/ai-frontier-daily">GitHub 仓库</a><span id="hits"></span></footer>

<script src="skills/ai-daily-digest/cards.js"></script>
<script>
const DAY_MS = 864e5;
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };

// 厂商显示名直接从 cards.js 的 VENDORS 注册表派生（加厂商只需改 cards.js，这里不用动）
const VENDOR_NAMES = Object.fromEntries(
  Object.entries((window.Cards && window.Cards.VENDORS) || {}).map(([k, v]) => [k, v.name]));
let ALL = [];                   // 所有厂商的全部天
let DAYS = [], byDate = {};     // 当前厂商的天 / 当前厂商按日期索引
let curVendor = "anthropic", curDate = null;
let car = null;                 // 轮播状态 {cards, active, deck}
const dataCache = {};           // "vendor|date" -> data.json
const DAILY = "__daily__";      // 跨厂商日报的伪厂商 id
const VC = {anthropic:"#C1572E", openai:"#10A37F", gemini:"#3B5BD0", nvidia:"#5E9400", cn:"#C8281E"};
const TAG_ORDER = ["模型发布","开发者","企业","研究","生态","政策","安全"];  // 日报分组顺序

(async function(){
  let idx;
  try{ idx = await fetchJSON("output/index.json"); }catch(e){ idx = {days:[]}; }
  ALL = (idx.days || []).map(d => ({...d, vendor: d.vendor || "anthropic"}));
  if(!ALL.length){
    $("#vendors").innerHTML = "";
    $("#app").innerHTML = `<div class="empty">还没有发布的内容。运行 <code>python run.py</code> 生成后即会出现在这里。</div>`;
    return;
  }
  ALL.sort((a,b)=> a.date<b.date?-1:1);
  // Tab 顺序跟随 cards.js 的 VENDORS 注册表定义顺序（Anthropic→OpenAI→Gemini→NVIDIA）；
  // 注册表里没有的厂商按字母序排到最后。
  const order = Object.keys((window.Cards && window.Cards.VENDORS) || {});
  const rank = v => { const i = order.indexOf(v); return i < 0 ? 99 : i; };
  const present = (idx.vendors && idx.vendors.length ? idx.vendors
                : [...new Set(ALL.map(d=>d.vendor))])
                .slice().sort((a,b)=> rank(a)-rank(b) || (a<b?-1:1));
  renderVendorTabs(present);
  await applyVendor(DAILY);                       // 默认进「日报」跨厂商总览
})();

async function fetchJSON(u){
  const r = await fetch(u + "?_=" + Date.now());
  if(!r.ok) throw new Error(u);
  return r.json();
}
async function dayData(vendor, date){
  const k = vendor + "|" + date;
  if(!dataCache[k]) dataCache[k] = await fetchJSON(`data/${vendor}/${date}.json`);
  return dataCache[k];
}

function renderVendorTabs(present){
  const wrap = $("#vendors");
  wrap.innerHTML =
    `<span class="vtab vtab-daily" data-v="${DAILY}"><span class="dotv"></span>日报</span>` +
    present.map(v =>
    `<span class="vtab" data-v="${v}"><span class="dotv"></span>${VENDOR_NAMES[v]||v}</span>`
  ).join("");
  wrap.onclick = e => { const el = e.target.closest(".vtab"); if(el) applyVendor(el.dataset.v); };
}

async function applyVendor(vendor){
  curVendor = vendor;
  const isDaily = vendor === DAILY;
  document.body.className = isDaily ? "v-daily" : "v-" + vendor;   // 日报无覆盖=默认主题
  document.querySelectorAll(".vtab").forEach(el => el.classList.toggle("on", el.dataset.v===vendor));
  if(isDaily){
    // 跨厂商：按日期把各厂商当天聚成一条，count 为四家之和
    const dates = [...new Set(ALL.map(d=>d.date))].sort((a,b)=> a<b?-1:1);
    DAYS = dates.map(date=>{
      const recs = ALL.filter(d=>d.date===date);
      return {vendor:DAILY, date, cnDate:(recs[0]||{}).cnDate||date,
              count: recs.reduce((s,r)=>s+(r.count||0),0)};
    });
  }else{
    DAYS = ALL.filter(d => d.vendor===vendor).sort((a,b)=> a.date<b.date?-1:1);
  }
  byDate = Object.fromEntries(DAYS.map(d=>[d.date,d]));
  $("#sub").textContent = isDaily
    ? "每日跨厂商 AI 动态总览 · 一屏看懂今天 AI 圈。"
    : `每日采集 ${VENDOR_NAMES[vendor]||vendor} 官方动态。`;
  if(DAYS.length) await selectDay(DAYS[DAYS.length-1].date);
  renderHeatmap();
}

async function selectDay(date){
  const d = byDate[date]; if(!d) return;
  const vendor = curVendor;
  curDate = date;
  document.querySelectorAll(".cell").forEach(el => el.classList.toggle("sel", el.dataset.d===date));
  $("#meta").textContent = `${d.cnDate||d.date}${d.edition?" · "+d.edition:""} · ${vendor===DAILY?"全网":"采集"} ${d.count} 条`;

  if(vendor===DAILY){ await renderDigest(date); return; }

  let deck = [];
  try{
    const data = await dayData(vendor, date);
    deck = window.Cards.buildDeck(data).filter(c => /\bxhs\b/.test(c.cls));   // 仅小红书卡
  }catch(e){
    $("#app").innerHTML = `<div class="empty">读取 data/${vendor}/${date}.json 失败。</div>`; return;
  }
  if(date!==curDate || vendor!==curVendor) return;     // 期间又切了别的日期/厂商，丢弃过期结果

  $("#app").innerHTML =
    `<div class="carousel" id="carousel"><div class="stage" id="stage">`+
    deck.map((c,i)=>`<div class="card3d" data-i="${i}">`+
      `<div class="card ${c.cls} deckcard">${c.inner}</div></div>`).join("")+
    `</div><button class="nav prev" id="navPrev">‹</button>`+
    `<button class="nav next" id="navNext">›</button></div>`+
    `<div class="dots" id="dots">`+
    deck.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join("")+`</div>`;
  initCarousel(deck);
}

/* ---- 跨厂商日报：拉通当天四家，按标签分组的纵向列表 ---- */
async function renderDigest(date){
  car = null;                                      // 退出轮播态，避免 resize 操作已卸载的卡片
  const vendor = curVendor;
  const recs = ALL.filter(d => d.date===date);
  let datas;
  try{
    datas = await Promise.all(recs.map(r =>
      dayData(r.vendor, date).then(dd => ({vendor:r.vendor, dd})).catch(()=>null)));
  }catch(e){ $("#app").innerHTML = `<div class="empty">读取当天数据失败。</div>`; return; }
  if(date!==curDate || vendor!==curVendor) return; // 期间又切了日期/厂商，丢弃过期结果

  const order = Object.keys((window.Cards && window.Cards.VENDORS) || {});
  const vrank = v => { const i = order.indexOf(v); return i<0?99:i; };
  const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const src = (window.Cards && window.Cards.srcHTML) || (u => esc(u.source));  // 复用卡片同款来源链接

  let items = [];
  datas.filter(Boolean).forEach(({vendor:v, dd}) =>
    (dd.updates||[]).forEach(u => items.push({...u, vendor:v})));
  if(!items.length){ $("#app").innerHTML = `<div class="empty">这一天还没有动态。</div>`; return; }

  const groups = {};
  items.forEach(u => { (groups[u.tag] = groups[u.tag] || []).push(u); });
  const tags = [...TAG_ORDER.filter(t => groups[t]),
                ...Object.keys(groups).filter(t => !TAG_ORDER.includes(t))];

  $("#app").innerHTML = `<div class="digest">` + tags.map(tag => {
    const list = groups[tag].slice().sort((a,b) => vrank(a.vendor)-vrank(b.vendor));
    return `<div class="dgroup"><h3 class="dtag">${esc(tag)}<span class="dn">${list.length}</span></h3>` +
      list.map(u => `<div class="ditem">`+
        `<span class="vbadge" style="--vc:${VC[u.vendor]||"#999"}"><span class="vdot"></span>${esc(u.company||VENDOR_NAMES[u.vendor]||u.vendor)}</span>`+
        `<div class="dbd"><h4>${esc(u.title)}</h4><p>${esc(u.summary)}</p>`+
        `<div class="dsrc">↗ ${src(u)}</div></div>`+
      `</div>`).join("") + `</div>`;
  }).join("") + `</div>`;
}

/* ---- 3D 轮播 ---- */
function initCarousel(deck){
  const stage = $("#stage");
  car = { cards:[...stage.children], active:0, deck };
  dealIn();                       // 切换日期：洗牌发牌入场

  $("#navPrev").onclick = ()=> goCar(car.active-1);
  $("#navNext").onclick = ()=> goCar(car.active+1);
  $("#dots").onclick = e => { const t=e.target.closest(".dot"); if(t) goCar(+t.dataset.i); };
  stage.onclick = e => {
    const c = e.target.closest(".card3d"); if(!c) return;
    const i = +c.dataset.i;
    if(i===car.active) openCard(i);   // 点中间 → 放大
    else goCar(i);                    // 点两侧 → 转过去
  };

  let x0=null;
  const down = e => { x0 = (e.touches?e.touches[0]:e).clientX; };
  const up = e => {
    if(x0===null) return;
    const x1 = (e.changedTouches?e.changedTouches[0]:e).clientX;
    if(Math.abs(x1-x0) > 40) goCar(car.active + (x1<x0?1:-1));
    x0=null;
  };
  stage.addEventListener("touchstart", down, {passive:true});
  stage.addEventListener("touchend", up);
  stage.addEventListener("mousedown", down);
  window.addEventListener("mouseup", up);
}

function goCar(i){
  if(!car) return;
  car.active = Math.max(0, Math.min(car.cards.length-1, i));
  layoutCarousel();               // 左右翻看：平滑 coverflow 过渡
}

// 把单张卡片摆到 coverflow 目标位
function placeCard(el, i){
  const stageW = ($("#carousel")||{}).clientWidth || 600;
  const spread = Math.min(180, stageW*0.28);
  const dd = i - car.active, ad = Math.abs(dd);
  el.classList.toggle("active", dd===0);
  if(ad>3){
    el.style.opacity = 0; el.style.pointerEvents = "none";
    el.style.transform = `translate(-50%,-50%) translateX(${dd*60}px) translateZ(-700px)`;
    return;
  }
  el.style.opacity = 1 - ad*0.16;
  el.style.pointerEvents = "auto";
  el.style.zIndex = 20 - ad;
  el.style.filter = ad ? `brightness(${1-ad*0.08})` : "none";
  el.style.transform = `translate(-50%,-50%) translateX(${dd*spread}px) `+
    `translateZ(${-ad*140}px) rotateY(${-dd*44}deg) scale(${1-ad*0.05})`;
}

function updateDots(){
  document.querySelectorAll("#dots .dot").forEach((el,i)=>
    el.classList.toggle("on", i===car.active));
}

// 翻看（同一天内）：直接过渡，无错位延迟
function layoutCarousel(){
  if(!car) return;
  car.cards.forEach((el,i)=>{ el.style.transitionDelay = "0ms"; placeCard(el,i); });
  updateDots();
}

// 切换日期入场：先叠成一摞「洗牌」，再依次发牌散开
function dealIn(){
  if(!car) return;
  const n = car.cards.length, mid = (n-1)/2;
  car.cards.forEach((el,i)=>{
    el.style.transition = "none";
    el.style.transitionDelay = "0ms";
    el.style.zIndex = 50 - Math.abs(i-car.active);
    el.style.opacity = Math.abs(i-car.active) > 3 ? 0 : 1;
    el.style.filter = "none";
    el.style.transform = `translate(-50%,-50%) translateY(48px) `+
      `rotate(${(i-mid)*4}deg) scale(.8)`;            // 叠成一摞微扇形
  });
  void $("#stage").offsetWidth;                        // 强制 reflow 固化初始态
  requestAnimationFrame(()=>{
    if(!car) return;                                   // 入场动画排队期间已切到日报/别处（car 置空），跳过
    car.cards.forEach((el,i)=>{
      el.style.transition = "";                        // 恢复 CSS 过渡
      el.style.transitionDelay = (Math.min(Math.abs(i-car.active),4)*60)+"ms";  // 由中心向外错位发牌
      placeCard(el,i);
    });
    updateDots();
    setTimeout(()=>{ if(car) car.cards.forEach(el=>el.style.transitionDelay="0ms"); }, 900);
  });
}

/* ---- GitHub 风格热力图（过去一年） ---- */
function renderHeatmap(){
  const heat = $("#heat"), cal = $("#cal");
  const today = parseISO(iso(new Date()));
  let start = new Date(today); start.setDate(start.getDate()-364);
  start.setDate(start.getDate()-start.getDay());

  const max = Math.max(1, ...DAYS.map(d=>d.count));
  const level = c => c<=0?0 : c>=max?4 : Math.max(1,Math.ceil(c/max*4));
  const months = "1月,2月,3月,4月,5月,6月,7月,8月,9月,10月,11月,12月".split(",");
  const wd = ["","一","","三","","五",""];

  let cols = [{label:true}], cur = new Date(start), lastMon = -1;
  while(cur <= today){
    let col = {mon:"", cells:[]};
    if(cur.getMonth() !== lastMon){ col.mon = months[cur.getMonth()]; lastMon = cur.getMonth(); }
    for(let r=0;r<7;r++){
      const ds = iso(cur);
      col.cells.push({ds, rec: byDate[ds], inRange: cur <= today});
      cur.setDate(cur.getDate()+1);
    }
    cols.push(col);
  }

  cal.innerHTML = cols.map(c => {
    if(c.label) return `<div class="mon"></div>` + wd.map(w=>`<div class="wd">${w}</div>`).join("");
    return `<div class="mon">${c.mon}</div>` + c.cells.map(cell=>{
      if(!cell.inRange) return `<div class="cell" style="visibility:hidden"></div>`;
      const cnt = cell.rec ? cell.rec.count : 0;
      return `<div class="cell l${level(cnt)}${cell.rec?" has":""}" data-d="${cell.ds}" data-c="${cnt}"></div>`;
    }).join("");
  }).join("");

  const total = DAYS.reduce((s,d)=>s+d.count,0);
  $("#heatHint").textContent = `共 ${DAYS.length} 天发布 · 累计采集 ${total} 条动态`;
  heat.hidden = false;
  if(curDate){ const c = cal.querySelector(`.cell[data-d="${curDate}"]`); if(c) c.classList.add("sel"); }
  // 默认滚到最右（最近一周）：移动端无需手动右滑即可看到当天数据
  requestAnimationFrame(()=>{ const w = cal.parentElement; if(w) w.scrollLeft = w.scrollWidth; });

  const tip = $("#tip");
  // 用可覆盖的 on* 句柄（每次切厂商都会重渲热力图，避免重复叠加监听）
  cal.onmousemove = e=>{
    const c = e.target.closest(".cell");
    if(!c || c.style.visibility==="hidden"){ tip.style.opacity=0; return; }
    const rec = byDate[c.dataset.d];
    tip.textContent = `${rec?rec.cnDate:c.dataset.d}：${c.dataset.c} 条`;
    tip.style.left = e.clientX+"px"; tip.style.top = (e.clientY-12)+"px"; tip.style.opacity=1;
  };
  cal.onmouseleave = ()=> tip.style.opacity=0;
  cal.onclick = e=>{
    const c = e.target.closest(".cell.has"); if(!c) return;
    selectDay(c.dataset.d);
    $("#app").scrollIntoView({behavior:"smooth", block:"start"});
  };
}

/* ---- 灯箱：放大同一张卡片 ---- */
const box = $("#box"), boxStage = $("#boxStage");
function openCard(idx){
  if(!car || !car.deck[idx]) return;
  const c = car.deck[idx];
  const s = Math.min(window.innerHeight*0.92/1440, window.innerWidth*0.95/1080);
  boxStage.style.width = (1080*s)+"px";
  boxStage.style.height = (1440*s)+"px";
  boxStage.innerHTML = `<div class="card ${c.cls} deckcard" style="transform:scale(${s})">${c.inner}</div>`;
  box.style.display = "flex";
}
function closeBox(){ box.style.display = "none"; boxStage.innerHTML = ""; }
box.addEventListener("click", closeBox);
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") return closeBox();
  if(box.style.display==="flex") return;
  if(e.key==="ArrowLeft" && car) goCar(car.active-1);
  if(e.key==="ArrowRight" && car) goCar(car.active+1);
});
window.addEventListener("resize", layoutCarousel);
