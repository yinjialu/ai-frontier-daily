# 信息源配置（按厂商分组）。live 模式按 --vendor 抓取对应分组下的 RSS。
# 结构：
#   vendors:
#     <vendor_id>:
#       rss:     [{name, url, limit}]   # feedparser 可直接解析，供 CI 无人值守
#       webfetch:[{name, url}]          # 无 RSS、但内容可被 WebFetch 抓到，供 Claude 驱动路径补充
vendors:
  anthropic:
    # 注：anthropic.com/news、/research 是 JS 渲染、无官方 RSS，
    #     建议用 RSSHub 自建实例转成 RSS 后把 url 填到下面；或日常走 Claude 驱动用 WebFetch。
    rss:
      - name: Claude Code Releases       # 官方 GitHub Releases Atom（原 changelog.rss 已 404）
        url: https://github.com/anthropics/claude-code/releases.atom
        limit: 10
      - name: Anthropic Engineering      # 社区镜像 RSS（非官方，可能停更）
        url: https://raw.githubusercontent.com/conoro/anthropic-engineering-rss-feed/main/anthropic_engineering_rss.xml
        limit: 10
      - name: anthropics GitHub Releases
        url: https://github.com/anthropics/claude-agent-sdk-typescript/releases.atom
        limit: 10
    webfetch:
      # 主站 news 页 JS 渲染、CI feedparser 抓不了，但 Claude 驱动（routine）可 WebFetch。
      - name: Anthropic News
        url: https://www.anthropic.com/news

  openai:
    # 好消息：OpenAI 官方提供可用 RSS（/blog/rss.xml 与 /news/rss.xml 是同一个 feed），
    # 加上 GitHub releases.atom，CI 无人值守无需 RSSHub。均经 2026-06 实测有效。
    rss:
      - name: OpenAI News                 # 官方 RSS（含产品/政策/合作等主站动态）
        url: https://openai.com/news/rss.xml
        limit: 10
      - name: OpenAI Codex CLI Releases   # 官方 GitHub Atom（openai/codex）
        url: https://github.com/openai/codex/releases.atom
        limit: 10
      - name: openai-python Releases      # 官方 GitHub Atom
        url: https://github.com/openai/openai-python/releases.atom
        limit: 10
      - name: openai-node Releases        # 官方 GitHub Atom
        url: https://github.com/openai/openai-node/releases.atom
        limit: 10
      # 可选（需自建 RSSHub 实例，把 <实例> 换掉）：
      # - name: ChatGPT Release Notes (via RSSHub)
      #   url: https://<你的rsshub实例>/openai/chatgpt/release-notes
      #   limit: 10
    webfetch:
      # 无 RSS、但 SSR 内容可被 WebFetch 抓到（日常 Claude 驱动用作补充）。
      # 注：openai.com/news 网页本身对 WebFetch 返回 403，请用上面的 RSS 代替。
      - name: OpenAI API/Platform Changelog
        url: https://developers.openai.com/api/docs/changelog

  nvidia:
    # NVIDIA 官方三大站均提供真 RSS/Atom（2026-06 实测 feedparser 可直读）+ GitHub releases.atom，
    # CI 无人值守无需 RSSHub。聚焦 AI/数据中心/GPU/开发者。
    # 避坑：nvidianews.nvidia.com/rss 是 HTML soft-404，须用 /releases.xml；博客 /category/ai/feed/ 为 404。
    rss:
      - name: NVIDIA Newsroom             # 官方新闻稿 RSS（重磅发布/合作首选）
        url: https://nvidianews.nvidia.com/releases.xml
        limit: 10
      - name: NVIDIA Blog                 # 官方 RSS（AI/数据中心/机器人综合）
        url: https://blogs.nvidia.com/feed/
        limit: 10
      - name: NVIDIA Technical Blog       # 官方 Atom（开发者/CUDA/推理软件）
        url: https://developer.nvidia.com/blog/feed
        limit: 10
      - name: TensorRT-LLM Releases       # 官方 GitHub Atom（LLM 推理；atom 体积大，超时给足）
        url: https://github.com/NVIDIA/TensorRT-LLM/releases.atom
        limit: 10
      - name: NVIDIA Dynamo Releases      # 官方 GitHub Atom（新一代推理服务）
        url: https://github.com/ai-dynamo/dynamo/releases.atom
        limit: 10
      - name: Triton Inference Server Releases   # 官方 GitHub Atom
        url: https://github.com/triton-inference-server/server/releases.atom
        limit: 10
      - name: NeMo Releases               # 官方 GitHub Atom（训练/微调框架）
        url: https://github.com/NVIDIA/NeMo/releases.atom
        limit: 10
      - name: TensorRT Releases           # 官方 GitHub Atom（推理编译器）
        url: https://github.com/NVIDIA/TensorRT/releases.atom
        limit: 10
      - name: CUDA Python Releases        # 官方 GitHub Atom
        url: https://github.com/NVIDIA/cuda-python/releases.atom
        limit: 10
      - name: Cosmos Releases             # 官方 GitHub Atom（物理 AI 基础模型）
        url: https://github.com/NVIDIA/Cosmos/releases.atom
        limit: 5

  gemini:
    # 坑：Google 自有 RSS（blog.google / deepmind.google / developers.googleblog.com）内容真实有效，
    #   但其 CDN 按 UA/指纹拦截裸 curl/requests（实测 curl 返回 000）。
    #   ✓ collector 现已内置「浏览器 UA + 重试退避 + 超时」抓取，这些源 CI 可直抓；
    #     仍抓不动会被 sources_health.json 标记失败，可再回退到下方 webfetch（Claude 驱动）。
    #   GitHub releases.atom 稳定，CI 安全。
    #   旧 SDK generative-ai-python/js 已归档，勿用，已迁移到 python-genai / js-genai。
    #   注：官方 API Changelog 只有 HTML / changelog.md.txt（markdown），非 feed，feedparser 无法解析
    #       且 .md.txt 现已 302 跳转——故不放进 rss，改由下方 webfetch 的 HTML changelog 走 Claude 驱动。
    rss:
      - name: python-genai Releases       # 官方 GitHub Atom，现行 Python SDK，CI 安全
        url: https://github.com/googleapis/python-genai/releases.atom
        limit: 8
      - name: js-genai Releases           # 官方 GitHub Atom，现行 JS SDK，CI 安全
        url: https://github.com/googleapis/js-genai/releases.atom
        limit: 8
      - name: gemini-cli Releases         # 官方 GitHub Atom（注意过滤 -nightly 噪声；官方将转 Antigravity CLI）
        url: https://github.com/google-gemini/gemini-cli/releases.atom
        limit: 5
      # 以下 Google 自有 RSS：内容最好但 CI 裸抓易被拦，需浏览器 UA；失败回退到下方 webfetch。
      - name: The Keyword – Gemini        # 官方 RSS，已按 Gemini 过滤（首选内容源）
        url: https://blog.google/products/gemini/rss/
        limit: 10
      - name: Google DeepMind Blog        # 官方 RSS，研究向，与产品线互补
        url: https://deepmind.google/blog/rss.xml
        limit: 8
    webfetch:
      # 无 RSS 或 CI 抓不动、但 SSR/WebFetch 可读（日常 Claude 驱动补充）：
      - name: Gemini API Changelog (HTML)
        url: https://ai.google.dev/gemini-api/docs/changelog
      - name: The Keyword – Gemini
        url: https://blog.google/products/gemini/rss/
      - name: The Keyword – DeepMind
        url: https://blog.google/technology/google-deepmind/rss/
      - name: Google for Developers Blog
        url: https://developers.googleblog.com/feed/

  # ===== 国内大模型「聚合轨」cn =====
  # 国内厂商分散、单家更新低频，故合成一条聚合轨：每天跨多家公司择优 ≤10 条，
  # 每条 data update 带 company 字段标注来源公司（DeepSeek/通义/智谱/Kimi/豆包/文心/混元/
  # MiniMax/阶跃星辰/百川/零一万物/百灵），渲染成公司徽标。
  #
  # 信源现实（2026-06 实测）：各家「真正的模型发布」几乎都只在官网博客/changelog（无 RSS），
  # GitHub releases.atom 多为 CLI/SDK/框架线、非模型本体；故本轨**以 webfetch 为主信号**
  # （Claude 驱动 routine 逐个 WebFetch），rss 仅作 CI 无人值守的弱兜底。
  # 注意：rss 段为 github.com releases.atom，已 curl 实测 200 + 含真实 entry；
  #   webfetch 段官网/博客本次沙箱只放行 github 未能实测正文，仅确认为官方 URL，
  #   CI/本机首次接入时请逐条复测，404/403 的删掉。国内站（火山/腾讯云/文心）海外 IP 可能连不通。
  cn:
    rss:
      # 月之暗面 Kimi：GitHub 信号最好，两条都活跃
      - name: Kimi Code CLI Releases        # 最新 2026-06-14，极活跃
        url: https://github.com/MoonshotAI/kimi-code/releases.atom
        limit: 8
      - name: Kimi CLI Releases             # 最新 2026-06-05
        url: https://github.com/MoonshotAI/kimi-cli/releases.atom
        limit: 8
      # 阿里 通义千问 Qwen：模型仓无 release，仅 CLI 工具线活跃
      - name: Qwen Code Releases            # 最新 v0.18.0 2026-06-12，极活跃
        url: https://github.com/QwenLM/qwen-code/releases.atom
        limit: 8
      # MiniMax：cli 活跃；模型发布看官网 news（见 webfetch）
      - name: MiniMax CLI Releases          # 最新 v1.0.16 2026-06-01
        url: https://github.com/MiniMax-AI/cli/releases.atom
        limit: 8
      # 蚂蚁 百灵 inclusionAI：AWorld 框架活跃；模型 Ling 看官网博客（见 webfetch）
      - name: inclusionAI AWorld Releases   # 最新 v0.3.2 2026-05-25（agent 框架）
        url: https://github.com/inclusionAI/AWorld/releases.atom
        limit: 8
      # 智谱 Z.ai：SDK 可解析但更新慢（最新仅到 2026-02），作为弱信号
      - name: Zhipu Z.ai Python SDK Releases
        url: https://github.com/zai-org/z-ai-sdk-python/releases.atom
        limit: 5
      # DeepSeek：底层库有动静信号（DeepGEMM 较活跃）；模型/API 公告看官网 changelog（见 webfetch）
      - name: DeepSeek DeepGEMM Releases
        url: https://github.com/deepseek-ai/DeepGEMM/releases.atom
        limit: 5
    webfetch:
      # 各家「真正的模型发布」主信号 —— 无 RSS，Claude 驱动 WebFetch；HuggingFace org 页是模型权重发布信号。
      # --- DeepSeek ---
      - name: DeepSeek API Change Log
        url: https://api-docs.deepseek.com/updates
      - name: DeepSeek HuggingFace
        url: https://huggingface.co/deepseek-ai
      # --- 阿里 通义千问 Qwen ---
      - name: Qwen Blog
        url: https://qwen.ai/blog
      - name: Qwen HuggingFace
        url: https://huggingface.co/Qwen
      # --- 智谱 GLM / Z.ai ---
      - name: Z.ai Blog
        url: https://z.ai/blog
      - name: Zhipu 新品发布
        url: https://docs.bigmodel.cn/cn/update/new-releases
      # --- 月之暗面 Kimi / Moonshot ---
      - name: Moonshot Platform Changelog
        url: https://platform.moonshot.ai/docs/changelog
      - name: Kimi HuggingFace
        url: https://huggingface.co/moonshotai
      # --- 字节 豆包 / 火山方舟 ---
      - name: Volcengine Ark 产品更新公告
        url: https://www.volcengine.com/docs/82379/1159177
      - name: ByteDance Seed Blog
        url: https://seed.bytedance.com/zh/blog
      # --- 百度 文心 ERNIE / 千帆 ---
      - name: 千帆 ModelBuilder 更新动态
        url: https://cloud.baidu.com/doc/qianfan-docs/index.html
      # --- 腾讯 混元 Hunyuan ---
      - name: Tencent Hunyuan 产品动态
        url: https://cloud.tencent.com/document/product/1729/97765
      # --- MiniMax ---
      - name: MiniMax News
        url: https://www.minimax.io/news
      # --- 阶跃星辰 StepFun ---
      - name: StepFun 官网
        url: https://www.stepfun.com/
      # --- 百川智能 Baichuan ---
      - name: Baichuan 官网
        url: https://www.baichuan-ai.com/
      # --- 零一万物 Yi / 01.AI ---
      - name: 01.AI 官网
        url: https://www.01.ai/cn
      # --- 蚂蚁 百灵 Ling / inclusionAI ---
      - name: inclusionAI Blog
        url: https://inclusionai.github.io/blog/
