# 信息源配置（按厂商分组）。live 模式按 --vendor 抓取对应分组下的 RSS。
# 结构：
#   vendors:
#     <vendor_id>:
#       rss:     [{name, url, limit}]   # feedparser 可直接解析，供 CI 无人值守
#       webfetch:[{name, url}]          # 无 RSS、但内容可被 WebFetch 抓到，供 Claude 驱动路径补充
vendors:
  anthropic:
    # 注：anthropic.com/news、/research 是 JS 渲染、无官方 RSS，
    #     建议用 RSSHub 自建实例转成 RSS 后把 url 填到下面；或日常走 Claude 驱动用 WebFetch。
    rss:
      - name: Claude Code Changelog      # 官方 RSS
        url: https://code.claude.com/docs/en/changelog.rss
        limit: 10
      - name: Anthropic Engineering      # 社区镜像 RSS（非官方，可能停更）
        url: https://raw.githubusercontent.com/conoro/anthropic-engineering-rss-feed/main/anthropic_engineering_rss.xml
        limit: 10
      - name: anthropics GitHub Releases
        url: https://github.com/anthropics/claude-agent-sdk-typescript/releases.atom
        limit: 10
    # webfetch（日常 Claude 驱动用，CI feedparser 抓不了）：
    #   - {name: Anthropic News, url: https://www.anthropic.com/news}

  openai:
    # 好消息：OpenAI 官方提供可用 RSS（/blog/rss.xml 与 /news/rss.xml 是同一个 feed），
    # 加上 GitHub releases.atom，CI 无人值守无需 RSSHub。均经 2026-06 实测有效。
    rss:
      - name: OpenAI News                 # 官方 RSS（含产品/政策/合作等主站动态）
        url: https://openai.com/news/rss.xml
        limit: 10
      - name: OpenAI Codex CLI Releases   # 官方 GitHub Atom（openai/codex）
        url: https://github.com/openai/codex/releases.atom
        limit: 10
      - name: openai-python Releases      # 官方 GitHub Atom
        url: https://github.com/openai/openai-python/releases.atom
        limit: 10
      - name: openai-node Releases        # 官方 GitHub Atom
        url: https://github.com/openai/openai-node/releases.atom
        limit: 10
      # 可选（需自建 RSSHub 实例，把 <实例> 换掉）：
      # - name: ChatGPT Release Notes (via RSSHub)
      #   url: https://<你的rsshub实例>/openai/chatgpt/release-notes
      #   limit: 10
    webfetch:
      # 无 RSS、但 SSR 内容可被 WebFetch 抓到（日常 Claude 驱动用作补充）。
      # 注：openai.com/news 网页本身对 WebFetch 返回 403，请用上面的 RSS 代替。
      - name: OpenAI API/Platform Changelog
        url: https://developers.openai.com/api/docs/changelog
