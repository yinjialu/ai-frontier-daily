# Server subscription inventory. RSSHub URLs are fallback transports; article URLs stay official.
# Health is measured from the VM, never inferred from an HTTP 200 alone.
sources:
  - {id: openai-news, name: OpenAI News, vendor: openai, type: rss, url: 'https://openai.com/news/rss.xml', domains: [openai.com, www.openai.com]}
  - {id: openai-api, name: OpenAI API, vendor: openai, type: markdown-changelog, url: 'https://developers.openai.com/api/docs/changelog.md', domains: [developers.openai.com]}
  - {id: anthropic-news, name: Anthropic, vendor: anthropic, type: html-links, url: 'https://www.anthropic.com/news', path_regex: '^/news/[^/]+', domains: [www.anthropic.com, anthropic.com], rsshub: '/anthropic/news'}
  - {id: claude-blog, name: Claude Blog, vendor: anthropic, type: html-links, url: 'https://claude.com/blog', path_regex: '^/blog/[^/]+', domains: [claude.com, www.claude.com]}
  - {id: anthropic-engineering, name: Anthropic Engineering, vendor: anthropic, type: html-links, url: 'https://www.anthropic.com/engineering', path_regex: '^/engineering/[^/]+', domains: [www.anthropic.com, anthropic.com], rsshub: '/anthropic/engineering'}
  - {id: anthropic-research, name: Anthropic Research, vendor: anthropic, type: html-links, url: 'https://www.anthropic.com/research', path_regex: '^/research/[^/]+', domains: [www.anthropic.com, anthropic.com], rsshub: '/anthropic/research'}
  - {id: deepmind, name: Google DeepMind, vendor: gemini, type: rss, url: 'https://deepmind.google/blog/rss.xml', domains: [deepmind.google, blog.google]}
  - {id: google-models, name: Google Models and Research, vendor: gemini, type: rss, url: 'https://blog.google/innovation-and-ai/models-and-research/rss/', domains: [blog.google]}
  - {id: gemini-api, name: Gemini API, vendor: gemini, type: changelog, url: 'https://ai.google.dev/gemini-api/docs/changelog', domains: [ai.google.dev]}
  - {id: vertex-release, name: Vertex AI, vendor: gemini, type: rss, url: 'https://cloud.google.com/feeds/vertex-ai-release-notes.xml', domains: [cloud.google.com, docs.cloud.google.com]}
  - {id: nvidia-news, name: NVIDIA Newsroom, vendor: nvidia, type: rss, url: 'https://nvidianews.nvidia.com/releases.xml', domains: [nvidianews.nvidia.com, blogs.nvidia.com]}
  - {id: nvidia-blog, name: NVIDIA Blog, vendor: nvidia, type: rss, url: 'https://blogs.nvidia.com/feed/', domains: [blogs.nvidia.com]}
  - {id: deepseek-news, name: DeepSeek, company: DeepSeek, vendor: cn, type: html-links, url: 'https://api-docs.deepseek.com/updates', path_regex: '^/(zh-cn/)?news/', domains: [api-docs.deepseek.com], rsshub: '/deepseek/news'}
  - {id: qwen-current, name: Qwen, company: 通义千问, vendor: cn, type: rss, url: 'http://127.0.0.1:1200/qwen/blog/zh-CN', domains: [qwen.ai]}
  - {id: qwen-legacy, name: Qwen Legacy Blog, company: 通义千问, vendor: cn, type: rss, url: 'https://qwenlm.github.io/blog/index.xml', domains: [qwenlm.github.io, qwen.ai]}
  - {id: zai-releases, name: Z.ai Releases, company: 智谱, vendor: cn, type: changelog, url: 'https://docs.z.ai/release-notes/new-released', domains: [docs.z.ai]}
  - {id: kimi-blog, name: Kimi, company: Kimi, vendor: cn, type: html-links, url: 'https://www.kimi.com/blog', path_regex: '^/blog/[^/]+', domains: [www.kimi.com, kimi.com, www.kimi.ai, kimi.ai]}
  - {id: bytedance-seed, name: ByteDance Seed, company: 豆包, vendor: cn, type: html-links, browser: true, url: 'https://seed.bytedance.com/zh/blog', path_regex: '^/(zh/)?blog/[^/]+', domains: [seed.bytedance.com]}
  - {id: minimax-news, name: MiniMax, company: MiniMax, vendor: cn, type: sitemap, url: 'https://www.minimax.io/sitemap.xml', path_regex: '^/(news|blog)/[^/]+', domains: [www.minimax.io, minimax.io]}
  - {id: inclusionai, name: inclusionAI, company: 百灵, vendor: cn, type: rss, url: 'https://inclusionai.github.io/blog/atom.xml', domains: [inclusionai.github.io, www.inclusion-ai.org, inclusion-ai.org]}
  - {id: xai-news, name: xAI Grok, vendor: frontier, type: html-links, url: 'https://x.ai/news', path_regex: '^/news/[^/]+', domains: [x.ai]}
  - {id: mistral-news, name: Mistral, vendor: frontier, type: html-links, url: 'https://mistral.ai/news/', path_regex: '^/news/[^/]+', domains: [mistral.ai]}
  - {id: meta-ai, name: Meta AI, vendor: frontier, type: html-links, url: 'https://ai.meta.com/blog/', path_regex: '^/blog/[^/]+', domains: [ai.meta.com]}

